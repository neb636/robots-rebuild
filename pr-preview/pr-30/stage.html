<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Character Stage</title>
    <style>
      :root { --panel: rgba(18, 20, 26, 0.86); --line: rgba(255, 255, 255, 0.08); --text: #e6e8f0; --dim: #8b90a0; --accent: #e8b46a; }
      html, body { margin: 0; height: 100%; background: #2a2b30; color: var(--text); overflow: hidden;
                   font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      button, input, select { font: inherit; color: inherit; }

      #side { position: fixed; top: 12px; left: 12px; bottom: 76px; width: 240px; display: flex; flex-direction: column;
              background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); }
      #side h2 { margin: 0; padding: 12px 14px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
      #chars { display: flex; flex-direction: column; gap: 4px; padding: 0 8px 8px; border-bottom: 1px solid var(--line); }
      .char { display: flex; flex-direction: column; align-items: flex-start; padding: 8px 10px; border-radius: 7px; border: 1px solid transparent;
              background: none; cursor: pointer; text-align: left; }
      .char small { color: var(--dim); }
      .char[aria-pressed="true"] { border-color: var(--accent); background: rgba(232, 180, 106, 0.08); }
      #filter { margin: 0 8px 6px; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.25); }
      #clips { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
      .clip { display: flex; justify-content: space-between; width: 100%; padding: 6px 10px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; }
      .clip:hover { background: rgba(255, 255, 255, 0.05); }
      .clip[aria-pressed="true"] { background: var(--accent); color: #1a1408; }
      .clip span:last-child { opacity: 0.6; font-variant-numeric: tabular-nums; }
      .clip .rm { font-size: 10px; margin-left: 6px; opacity: 0.7; }

      #bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
             padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(8px); }
      #bar button { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.06); cursor: pointer; }
      #bar label { display: flex; gap: 6px; align-items: center; color: var(--dim); white-space: nowrap; }
      #scrub { flex: 1; min-width: 160px; accent-color: var(--accent); }
      #time { font-variant-numeric: tabular-nums; min-width: 92px; color: var(--dim); }
      #speed { width: 80px; accent-color: var(--accent); }
      #name { font-weight: 600; min-width: 120px; }
      #help { position: fixed; top: 12px; right: 12px; padding: 6px 10px; color: var(--dim); font-size: 11px; background: var(--panel); border-radius: 8px; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--dim); pointer-events: none; }
      #help a { color: var(--accent); text-decoration: none; }
      #loading[hidden] { display: none; }

      @media (max-width: 700px) {
        #side { top: auto; bottom: 120px; right: 12px; width: auto; max-height: 40vh; }
        #help { display: none; }
      }
    </style>
    <script type="module" crossorigin src="/robots-rebuild/pr-preview/pr-30/assets/stage-DqEh2hD8.js"></script>
    <link rel="modulepreload" crossorigin href="/robots-rebuild/pr-preview/pr-30/assets/theo-DhXoiqq1.js">
  </head>
  <body>
    <canvas id="gl"></canvas>
    <aside id="side">
      <h2>Characters</h2>
      <div id="chars"></div>
      <h2>Animations <span id="count"></span></h2>
      <input id="filter" type="search" placeholder="Filter…" />
      <div id="clips"></div>
    </aside>
    <div id="bar">
      <button id="play" type="button">Pause</button>
      <span id="name"></span>
      <input id="scrub" type="range" min="0" max="1" step="0.0001" value="0" />
      <span id="time">0.00 / 0.00</span>
      <label>speed <input id="speed" type="range" min="0.1" max="2" step="0.05" value="1" /><span id="speedVal">1.00×</span></label>
      <label><input id="loop" type="checkbox" checked /> loop</label>
      <label><input id="inplace" type="checkbox" /> in place</label>
      <label><input id="fade" type="checkbox" checked /> crossfade</label>
      <label><input id="bones" type="checkbox" /> skeleton</label>
      <label><input id="follow" type="checkbox" checked /> follow</label>
    </div>
    <div id="help"><a href="./">← Title</a> · ↑↓ clip · space play · ←→ frame · drag orbit · wheel zoom</div>
    <div id="loading">Loading…</div>
  </body>
</html>
