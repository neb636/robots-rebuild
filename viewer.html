<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theo Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #858585; overflow: hidden; font: 12px/1.4 ui-monospace, Menlo, monospace; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; top: 8px; left: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
            max-width: calc(100% - 16px); padding: 6px 8px; background: rgba(20, 22, 30, 0.72); color: #e6e8f0; border-radius: 6px; }
      #ui select, #ui button, #ui input { font: inherit; }
      #ui label { display: flex; gap: 4px; align-items: center; }
      #frame { width: 160px; }
      #ui[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <div id="ui">
      <select id="model" title="Model file"></select>
      <select id="clip" title="Clip"></select>
      <button id="play" type="button">Pause</button>
      <label>frame <input id="frame" type="range" min="1" max="2" step="1" value="1" /><span id="frameNum">1</span></label>
      <select id="view" title="Camera">
        <option value="front34">¾ front</option>
        <option value="side">side</option>
        <option value="back">back</option>
        <option value="head">head</option>
        <option value="game">game distance</option>
      </select>
    </div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
